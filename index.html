<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock La Campechana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
html,body{height:100%;background:#f0f2f5;}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07);flex-wrap:wrap;}
.bar img{height:38px;width:auto;object-fit:contain;}
.dep-btn{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;color:#666;cursor:pointer;}
.dep-btn.active{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.ts{margin-left:auto;font-size:12px;color:#888;background:#f5f5f5;padding:6px 13px;border-radius:20px;white-space:nowrap;}
#frame{width:100%;border:0;height:calc(100vh - 62px);display:block;}
</style>
</head>
<body>
<div class="bar">
  <img src="https://raw.githubusercontent.com/alvarezlucasmtm/stock/main/logo.jpg" alt="La Campechana">
  <button class='dep-btn active' data-file='pilar.html' onclick="selectDep('pilar.html',this)">MTM Pilar</button><button class='dep-btn' data-file='tablada.html' onclick="selectDep('tablada.html',this)">La Tablada</button><button class='dep-btn' data-file='rojas.html' onclick="selectDep('rojas.html',this)">Proyecto Rojas</button>
  <div class="ts">&#9201; 01/09/2026 08:52</div>
</div>
<iframe id="frame" src=""></iframe>
<script>
function selectDep(file,btn){
  document.querySelectorAll('.dep-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  localStorage.setItem('dep_sel',file);
  document.getElementById('frame').src=file+'?v='+Date.now();
}
(function(){
  var last=localStorage.getItem('dep_sel')||'pilar.html';
  var btns=document.querySelectorAll('.dep-btn');
  var found=false;
  btns.forEach(function(b){ if(b.getAttribute('data-file')===last){ b.classList.add('active'); found=true; } else { b.classList.remove('active'); } });
  if(!found && btns.length){ btns[0].classList.add('active'); last=btns[0].getAttribute('data-file'); }
  document.getElementById('frame').src=last+'?v='+Date.now();
})();
</script>
</body>
</html>
